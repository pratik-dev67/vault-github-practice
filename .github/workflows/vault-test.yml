name: GitHub Actions Vault Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  vault-test:
    runs-on: self-hosted

    steps:
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://127.0.0.1:8200
          method: jwt
          role: github-actions
          secrets: |
            secret/data/myapp username | MYAPP_USERNAME ;
            secret/data/myapp password | MYAPP_PASSWORD

      - name: Test Vault secret
        run: |
          echo "Vault authentication successful"
          echo "Username: $MYAPP_USERNAME"
          echo "Password was retrieved successfully"
